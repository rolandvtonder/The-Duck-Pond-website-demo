# Netlify builds the site and handles the booking + contact forms
# (Site settings -> Forms -> Form notifications -> add bookings@theduckpond.co.za).
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
